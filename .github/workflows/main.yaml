name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-acr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build, tag, and push image to Azure ACR
        env:
          ACR_REGISTRY: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          IMAGE_NAME: chest-cancer
          IMAGE_TAG: latest
        run: |
          # Build Docker image
          docker build -t $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          
          # Push to Azure Container Registry
          docker push $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          
          echo "Image pushed: $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-acr-image
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      - name: Stop and remove old container
        run: |
          docker stop chest-cancer-app || true
          docker rm chest-cancer-app || true

      - name: Pull latest image from ACR
        run: |
          docker pull ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/chest-cancer:latest

      - name: Run new Docker container
        run: |
          docker run -d -p 8080:8080 --name chest-cancer-app \
            --restart unless-stopped \
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/chest-cancer:latest

      - name: Clean up old images
        run: |
          docker system prune -f